[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resegment-article"
version = "0.1.0"
description = "Tools for segmenting and refining articles from ALTO data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml",
    "numpy",
    "pandas",
    "Pillow",
    "requests",
    "validators",
    "opencv-python",
    "shapely"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]